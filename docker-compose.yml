# Local development infrastructure.
#
#   docker compose up -d                      -> Redis only (use LocalDB or any SQL Server for the database)
#   docker compose --profile sql up -d        -> Redis + SQL Server 2022 in a container
#
# The SQL Server container needs MSSQL_SA_PASSWORD set in your shell or in a local, uncommitted .env file.
services:
  redis:
    image: redis:7.4-alpine
    container_name: redisdemo-redis
    ports:
      - "6379:6379"
    # Append-only persistence so cached data survives a container restart (handy, not required).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: redisdemo-sqlserver
    profiles: ["sql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment or .env file}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

volumes:
  redis-data:
  sql-data:
